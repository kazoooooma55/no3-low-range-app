<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NO3 Field Calculator</title>

<style>
body { font-family:sans-serif; padding:15px; background:#f5f5f5;}
.card { background:white; padding:15px; margin-bottom:12px; border-radius:10px;}
input { width:100%; padding:8px; margin:4px 0;}
button { width:100%; padding:12px; background:#2563eb; color:white; border:none; border-radius:8px;}
.result { font-size:28px; font-weight:bold;}
.bad {color:red;}
.warn {color:orange;}
.good {color:green;}
</style>
</head>

<body>

<h2>NO₃⁻ Field Calculator</h2>

<div class="card">
<label>sample mV</label>
<input id="sample_mv" type="number">

<label>sample temp °C</label>
<input id="sample_temp" value="25">

<label>calibration temp °C</label>
<input id="cal_temp" value="25">
</div>

<div class="card">
<h3>Calibration</h3>

<script>
const concDefault=[0.5,3.01,15.06,30.13,60.26];
</script>

<div id="cal"></div>

</div>

<button onclick="calc()">Calculate</button>

<div class="card">
<div id="result" class="result">--</div>
<div id="qc"></div>
<div id="msg"></div>

<details>
<summary>研究用詳細</summary>
<div id="detail"></div>
</details>
</div>

<script>

function init(){
let html="";
for(let i=0;i<5;i++){
html+=`
<label>${concDefault[i]} mg/L</label>
<input id="mv${i}" placeholder="mV">
`;
}
document.getElementById("cal").innerHTML=html;
}
init();

function calc(){

let sample_mv=parseFloat(sample_mv_input());

let conc=[],mv=[];

for(let i=0;i<5;i++){
let m=parseFloat(document.getElementById("mv"+i).value);
if(!isNaN(m)){
conc.push(concDefault[i]);
mv.push(m);
}
}

if(conc.length<2){
alert("2点以上必要");
return;
}

let x=conc.map(c=>Math.log10(c));
let y=mv;

let n=x.length;

let slope,intercept,r2="N/A";

if(n===2){
slope=(y[1]-y[0])/(x[1]-x[0]);
intercept=y[0]-slope*x[0];
}else{
let mx=avg(x), my=avg(y);
let sxy=0,sxx=0,syy=0;
for(let i=0;i<n;i++){
sxy+=(x[i]-mx)*(y[i]-my);
sxx+=(x[i]-mx)*(x[i]-mx);
syy+=(y[i]-my)*(y[i]-my);
}
slope=sxy/sxx;
intercept=my-slope*mx;
r2=(sxy*sxy)/(sxx*syy);
}

let logC=(sample_mv-intercept)/slope;
let no3=Math.pow(10,logC);

let ideal=-59.16*((parseFloat(cal_temp_input())+273.15)/298.15);
let slopePct=Math.abs(slope/ideal)*100;

let level="Good";
let msg="安定した測定状態です。";

if(n===2){
level="注意";
msg="2点校正のため参考値として扱ってください。";
}
else{
if(r2<0.98 || slopePct<70){
level="再測定推奨";
msg="電極状態または校正に問題あり。再コンディショニング推奨。";
}
else if(r2<0.995 || slopePct<85){
level="注意";
msg="やや誤差が大きい可能性があります。";
}
}

document.getElementById("result").innerHTML=no3.toFixed(2)+" mg/L";
document.getElementById("qc").innerHTML=`QC: ${level} (points=${n})`;

document.getElementById("msg").innerHTML=msg;

document.getElementById("detail").innerHTML=
`Slope: ${slope.toFixed(2)}<br>
R²: ${r2}<br>
Slope%: ${slopePct.toFixed(1)}%`;

}

function avg(a){return a.reduce((x,y)=>x+y)/a.length;}

function sample_mv_input(){return document.getElementById("sample_mv").value;}
function cal_temp_input(){return document.getElementById("cal_temp").value;}

</script>

</body>
</html>
