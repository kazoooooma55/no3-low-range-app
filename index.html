<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NO3 Field Calculator</title>
  <style>
    :root{--bg:#f6f7f9;--card:#fff;--text:#111827;--muted:#6b7280;--accent:#2563eb;--ok:#047857;--warn:#b45309;--bad:#b91c1c;--border:#e5e7eb;}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:720px;margin:0 auto;padding:16px} h1{font-size:24px;margin:8px 0 4px}.subtitle{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:14px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 5px rgba(0,0,0,.04)}
    h2{font-size:17px;margin:0 0 10px} label{display:block;font-size:13px;color:var(--muted);margin:9px 0 5px}
    input,select{width:100%;box-sizing:border-box;font-size:18px;padding:12px;border-radius:12px;border:1px solid var(--border);background:white}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cal-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end;margin-bottom:8px}
    button{width:100%;font-size:18px;font-weight:700;padding:14px;border:0;border-radius:14px;background:var(--accent);color:white;margin:6px 0 12px}button.secondary{background:#374151}
    .result{font-size:34px;font-weight:800;margin:6px 0 4px}.subresult{font-size:18px;font-weight:700;margin:0 0 10px;color:#374151}.small{font-size:14px;color:var(--muted);line-height:1.6}
    .badge{display:inline-block;padding:6px 10px;border-radius:999px;font-size:14px;font-weight:800;margin:4px 4px 8px 0}.ok{background:#ecfdf5;color:var(--ok)}.caution{background:#fffbeb;color:var(--warn)}.bad{background:#fef2f2;color:var(--bad)}
    .message{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px;line-height:1.55}.msg-ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}.msg-caution{background:#fffbeb;border:1px solid #fde68a;color:#92400e}.msg-bad{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
    details{background:#f9fafb;border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-top:10px}summary{font-weight:700;cursor:pointer}
    table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}th,td{border-bottom:1px solid var(--border);padding:8px 4px;text-align:right}th:first-child,td:first-child{text-align:left}.row-actions{display:flex;gap:8px}.row-actions button{font-size:14px;padding:10px;margin:0}
  </style>
</head>
<body>
<div class="wrap">
  <h1>NO₃⁻ Field Calculator</h1>
  <div class="subtitle">森林・河川の市民科学調査向け。5点校正からNO₃⁻濃度を推定します。R²・残差などの詳細指標は研究開発・機器管理用です。</div>
  <div class="card"><h2>サンプル</h2><div class="grid2"><div><label>sample mV</label><input id="sample_mv" type="number" inputmode="decimal" placeholder="例: 79" /></div><div><label>sample temp °C</label><input id="sample_temp" type="number" inputmode="decimal" value="25" /></div></div><label>sample ID / メモ</label><input id="sample_id" type="text" placeholder="例: sta1" /></div>
  <div class="card"><h2>5点校正</h2><div class="small">標準液濃度の初期値は 0.5, 3.01, 15.06, 30.13, 60.26 mg/L。0 mg/Lは対数を取れないため使いません。</div><div id="calibration_rows"></div><div class="grid2"><div><label>calibration temp °C</label><input id="cal_temp" type="number" inputmode="decimal" value="25" /></div><div><label>表示単位</label><select id="unit_mode"><option value="NO3">NO₃⁻ mg/L</option><option value="NO3N">NO₃-N mg/L</option></select></div></div><label><input id="conditioning" type="checkbox" style="width:auto;" /> 久しぶり使用前にコンディショニング済み</label></div>
  <button onclick="calculate()">Calculate</button>
  <div class="card"><h2>結果</h2><div id="confidence_badge"></div><div id="result_main" class="result">-- mg/L</div><div id="result_sub" class="subresult"></div><div id="field_message" class="message msg-ok">値を入力してCalculateを押してください。</div><details><summary>研究開発・機器管理用の詳細</summary><div class="small" style="margin-top:8px;">※以下のR²・残差・スロープは研究開発・機器管理用の指標です。通常の現場利用では、上の評価メッセージを見れば十分です。</div><div id="details" class="small" style="margin-top:8px;"></div><div id="residual_table" class="small"></div></details><button class="secondary" onclick="saveLog()">この測定を保存</button></div>
  <div class="card"><h2>測定ログ</h2><div class="row-actions"><button class="secondary" onclick="exportCSV()">CSV Export</button><button class="secondary" onclick="clearLogs()">ログ削除</button></div><div id="log_table" class="small"></div></div>
</div>
<script>
const defaultConcs=[0.5,3.01,15.06,30.13,60.26];let lastResult=null;
function initCalibrationRows(){const box=document.getElementById('calibration_rows');box.innerHTML='';defaultConcs.forEach((c,i)=>{box.innerHTML+=`<div class="cal-row"><div><label>standard ${i+1} conc. mg/L</label><input id="c${i}" type="number" inputmode="decimal" value="${c}" /></div><div><label>standard ${i+1} mV</label><input id="mv${i}" type="number" inputmode="decimal" placeholder="mV" /></div></div>`})}
function num(id){const v=parseFloat(document.getElementById(id).value);return Number.isFinite(v)?v:null}function mean(a){return a.reduce((x,y)=>x+y,0)/a.length}
function linearRegression(x,y){const mx=mean(x),my=mean(y);let sxx=0,sxy=0,sst=0,sse=0;for(let i=0;i<x.length;i++){sxx+=(x[i]-mx)*(x[i]-mx);sxy+=(x[i]-mx)*(y[i]-my)}const slope=sxy/sxx,intercept=my-slope*mx,residuals=[];for(let i=0;i<x.length;i++){const pred=slope*x[i]+intercept,res=y[i]-pred;residuals.push(res);sst+=(y[i]-my)*(y[i]-my);sse+=res*res}return{slope,intercept,r2:sst===0?NaN:1-sse/sst,residuals,rmse:Math.sqrt(sse/x.length)}}
function calculate(){const sample_mv=num('sample_mv'),sample_temp=num('sample_temp'),cal_temp=num('cal_temp'),conditioning=document.getElementById('conditioning').checked,unitMode=document.getElementById('unit_mode').value;if([sample_mv,sample_temp,cal_temp].some(v=>v===null)){alert('サンプルmV、温度、校正温度を入力してください。');return}const conc=[],mv=[];for(let i=0;i<5;i++){const c=num('c'+i),m=num('mv'+i);if(c===null||m===null||c<=0){alert('5点すべての標準液濃度とmVを入力してください。濃度0は使えません。');return}conc.push(c);mv.push(m)}const x=conc.map(c=>Math.log10(c)),fit=linearRegression(x,mv),logC=(sample_mv-fit.intercept)/fit.slope,no3=Math.pow(10,logC),no3n=no3/4.4268,minC=Math.min(...conc),maxC=Math.max(...conc),ideal=-59.16*((cal_temp+273.15)/298.15),slopePercent=Math.abs(fit.slope/ideal)*100,tempDiff=Math.abs(sample_temp-cal_temp),absResiduals=fit.residuals.map(Math.abs),maxResidual=Math.max(...absResiduals),lowResidualMax=Math.max(absResiduals[0],absResiduals[1]);
let level='Good',levelClass='ok',message='安定した測定状態です。現場での傾向把握に使用できます。';const critical=[],caution=[];if(fit.r2<0.98)critical.push('校正点の直線性が低い');else if(fit.r2<0.995)caution.push('校正点にややばらつきがある');if(slopePercent<70||slopePercent>130)critical.push('電極の応答が弱い、または異常');else if(slopePercent<85||slopePercent>115)caution.push('電極応答が理論値からやや外れている');if(maxResidual>6)critical.push('校正点の残差が大きい');else if(maxResidual>3)caution.push('校正点の残差がやや大きい');if(tempDiff>5)critical.push('校正温度と測定温度の差が大きい');else if(tempDiff>2)caution.push('校正温度と測定温度に差がある');if(lowResidualMax>5)caution.push('低濃度側の校正点にずれがある');if(!conditioning)caution.push('久しぶり使用時はコンディショニング推奨');if(no3<minC)caution.push('校正下限未満');if(no3>maxC)caution.push('校正上限超過');if(critical.length>0){level='再測定推奨';levelClass='bad';message='電極の状態または校正に問題がある可能性があります。高濃度標準液で再コンディショニングし、再校正・再測定をおすすめします。'}else if(caution.length>0){level='注意';levelClass='caution';message='測定値は目安として使用できますが、誤差がやや大きい可能性があります。地点間比較や傾向把握を中心に扱ってください。'}
const shownMain=unitMode==='NO3'?no3:no3n,shownSub=unitMode==='NO3'?`NO₃-N: ${no3n.toFixed(3)} mg/L`:`NO₃⁻: ${no3.toFixed(3)} mg/L`;let mainText;if(no3<minC&&unitMode==='NO3')mainText=`< ${minC} mg/L`;else if(no3<minC&&unitMode==='NO3N')mainText=`< ${(minC/4.4268).toFixed(3)} mg/L`;else mainText=shownMain.toFixed(3)+' mg/L';document.getElementById('confidence_badge').innerHTML=`<span class="badge ${levelClass}">${level}</span>`;document.getElementById('result_main').textContent=mainText;document.getElementById('result_sub').textContent=shownSub;const msg=document.getElementById('field_message');msg.className='message '+(levelClass==='ok'?'msg-ok':levelClass==='caution'?'msg-caution':'msg-bad');msg.innerHTML=message+"<br><span class='small'>主な理由: "+(critical.concat(caution).join(' / ')||'特になし')+'</span>';document.getElementById('details').innerHTML=`Model: mV = ${fit.slope.toFixed(2)} × log10(C) + ${fit.intercept.toFixed(2)}<br>R²: ${fit.r2.toFixed(4)}<br>Slope: ${fit.slope.toFixed(2)} mV/decade (${slopePercent.toFixed(1)}% of ideal)<br>RMSE: ${fit.rmse.toFixed(2)} mV<br>Max residual: ${maxResidual.toFixed(2)} mV<br>Low-range max residual: ${lowResidualMax.toFixed(2)} mV<br>Calibration range: ${minC}–${maxC} mg/L as NO₃⁻`;const residualRows=conc.map((c,i)=>{const pred=fit.slope*Math.log10(c)+fit.intercept,res=fit.residuals[i];return `<tr><td>${c}</td><td>${mv[i].toFixed(2)}</td><td>${pred.toFixed(2)}</td><td>${res>=0?'+':''}${res.toFixed(2)}</td></tr>`}).join('');document.getElementById('residual_table').innerHTML=`<table><thead><tr><th>mg/L</th><th>obs mV</th><th>fit mV</th><th>residual</th></tr></thead><tbody>${residualRows}</tbody></table>`;lastResult={timestamp:new Date().toISOString(),sample_id:document.getElementById('sample_id').value||'',sample_mv,sample_temp,cal_temp,no3_mgL:no3,no3n_mgL:no3n,qc_level:level,qc_reasons:critical.concat(caution).join(' / '),slope:fit.slope,intercept:fit.intercept,r2:fit.r2,rmse_mV:fit.rmse,max_residual_mV:maxResidual,low_range_max_residual_mV:lowResidualMax,slope_percent_ideal:slopePercent}}
function saveLog(){if(!lastResult){alert('先にCalculateしてください。');return}const logs=JSON.parse(localStorage.getItem('no3_field_logs_v2')||'[]');logs.push(lastResult);localStorage.setItem('no3_field_logs_v2',JSON.stringify(logs));renderLogs()}
function renderLogs(){const logs=JSON.parse(localStorage.getItem('no3_field_logs_v2')||'[]');if(!logs.length){document.getElementById('log_table').innerHTML='保存されたログはありません。';return}const rows=logs.slice(-10).reverse().map(x=>{const dt=new Date(x.timestamp).toLocaleString();return `<tr><td>${dt}</td><td>${x.sample_id}</td><td>${x.no3_mgL.toFixed(3)}</td><td>${x.qc_level}</td></tr>`}).join('');document.getElementById('log_table').innerHTML=`<table><thead><tr><th>time</th><th>ID</th><th>NO₃⁻</th><th>QC</th></tr></thead><tbody>${rows}</tbody></table>`}
function exportCSV(){const logs=JSON.parse(localStorage.getItem('no3_field_logs_v2')||'[]');if(!logs.length){alert('ログがありません。');return}const headers=Object.keys(logs[0]);const csv=[headers.join(',')].concat(logs.map(row=>headers.map(h=>JSON.stringify(row[h]??'')).join(','))).join('\n');const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='no3_field_logs.csv';a.click();URL.revokeObjectURL(url)}
function clearLogs(){if(confirm('ログを削除しますか？')){localStorage.removeItem('no3_field_logs_v2');renderLogs()}}
initCalibrationRows();renderLogs();
</script>
</body>
</html>
